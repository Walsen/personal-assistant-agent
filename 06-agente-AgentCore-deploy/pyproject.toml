[project]
name = "personal-assistant-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sergio Rodriguez", email = "sergio@ffactory.io" }
]
requires-python = ">=3.14"
dependencies = [
    "strands-agents>=1.53.0",
    "strands-agents-tools>=0.8.6",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.154.0",
    "bedrock-agentcore>=1.18.0",
    "boto3>=1.35.0",
]

# NOTE: bedrock-agentcore-starter-toolkit (the old Python-based `agentcore`
# CLI) is deprecated by AWS in favor of the Node-based AgentCore CLI
# (@aws/agentcore, installed under .cli-tools/ - see DEPLOY_AGENTCORE.md).
# It is intentionally not listed here.

[project.scripts]
personal-assistant-agent = "personal_assistant_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "infra",
]
